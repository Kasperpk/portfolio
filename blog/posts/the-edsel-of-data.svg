<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#111111"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#2a2a2a"/>

  <!-- eyebrow -->
  <text x="80" y="122" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="3" fill="#908d85">DATA DESIGN &#183; LESSONS</text>

  <!-- title -->
  <text x="80" y="234" font-family="Lora, Georgia, serif" font-size="66" font-weight="600" fill="#e0ddd5">The Edsel</text>
  <text x="80" y="314" font-family="Lora, Georgia, serif" font-size="66" font-weight="600" fill="#e0ddd5">of data</text>

  <!-- launch arc: rises then crashes -->
  <!-- Baseline at y=530, peak at (640, 390) -->
  <path d="M 80,530 Q 640,360 1120,530" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="8 4"/>
  <path d="M 80,530 Q 360,390 640,390" fill="none" stroke="#908d85" stroke-width="3"/>
  <path d="M 640,390 Q 880,390 1120,530" fill="none" stroke="#5f3a3a" stroke-width="3"/>

  <!-- peak marker -->
  <circle cx="640" cy="390" r="7" fill="#e0ddd5"/>

  <!-- $400M label at peak -->
  <text x="655" y="384" font-family="'JetBrains Mono', monospace" font-size="18" fill="#e0ddd5">$400M</text>

  <!-- axis labels -->
  <text x="80" y="556" font-family="'JetBrains Mono', monospace" font-size="18" fill="#908d85">LAUNCH</text>
  <text x="1060" y="556" font-family="'JetBrains Mono', monospace" font-size="18" fill="#5f5d57">FAIL</text>

  <!-- footer -->
  <text x="80" y="592" font-size="22" fill="#908d85">On humility in design &#8212; cars, ketchup, or data</text>
  <text x="1120" y="592" text-anchor="end" font-family="Lora, Georgia, serif" font-size="22" fill="#908d85">Analytical Mastery</text>
</svg>
