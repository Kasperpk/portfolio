<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#111111"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#2a2a2a"/>

  <!-- eyebrow -->
  <text x="80" y="138" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="3" fill="#908d85">DATA LAB &#183; FIRST POST</text>

  <!-- title -->
  <text x="78" y="288" font-family="Lora, Georgia, serif" font-size="104" font-weight="700" letter-spacing="-2" fill="#e0ddd5">Hello World</text>

  <!-- editor strip -->
  <rect x="80" y="372" width="1040" height="118" rx="10" fill="#181818" stroke="#2a2a2a"/>
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#5f5d57">
    <circle cx="108" cy="400" r="5" fill="#2f2f2f"/>
    <circle cx="128" cy="400" r="5" fill="#2f2f2f"/>
    <circle cx="148" cy="400" r="5" fill="#2f2f2f"/>
    <text x="172" y="404">hello.py</text>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="30">
    <text x="108" y="458" fill="#5f5d57">&#187;</text>
    <text x="148" y="458" fill="#908d85">print(</text>
    <text x="262" y="458" fill="#e0ddd5">"Hello, World"</text>
    <text x="510" y="458" fill="#908d85">)</text>
    <rect x="534" y="436" width="16" height="28" fill="#e0ddd5"/>
  </g>

  <!-- footer -->
  <text x="80" y="568" font-size="22" fill="#908d85">An introduction</text>
  <text x="1120" y="568" text-anchor="end" font-family="Lora, Georgia, serif" font-size="22" fill="#908d85">Analytical Mastery</text>
</svg>
